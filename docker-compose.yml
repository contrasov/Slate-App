services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: slate_app
    volumes:
      - ./:/var/www
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        composer install &&
        php artisan migrate --force &&
        composer run dev
      "
    ports:
      - "8000:8000"
      - "5173:5173"

  postgres:
    image: postgres:16
    container_name: slate_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: slate_app
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d slate_app"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
